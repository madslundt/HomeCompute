name: Validate repository

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep shellcheck
      - name: Test TTLock webhook gateway
        run: |
          python3 -m venv /tmp/ttlock-test-venv
          /tmp/ttlock-test-venv/bin/pip install --require-hashes -r deploy/ttlock-webhook/requirements-test.lock
          /tmp/ttlock-test-venv/bin/pip install --no-deps -e deploy/ttlock-webhook
          /tmp/ttlock-test-venv/bin/pytest deploy/ttlock-webhook/tests
      - name: Validate NixOS, scripts, JSON, and Compose
        run: bash ./scripts/validate-repository.sh
      - name: Evaluate the Nix flake
        run: nix flake check --no-build
