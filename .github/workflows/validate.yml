name: Validate repository

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep shellcheck
      - name: Validate NixOS, scripts, JSON, and Compose
        run: bash ./scripts/validate-repository.sh
