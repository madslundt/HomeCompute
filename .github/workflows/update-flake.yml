name: Propose Nix flake updates

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nix-flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update flake inputs
        # The publish step owns the commit after checking for a lockfile diff
        # and configuring the bot identity.
        run: nix flake update
      - name: Create or refresh update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "Nix flake inputs are already current."
            exit 0
          fi

          branch=automation/nix-flake-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_ref="$(git ls-remote --heads origin "refs/heads/$branch")"
          expected_revision="${remote_ref%%[[:space:]]*}"
          git switch -C "$branch"
          git add flake.lock
          git commit -m "chore: update Nix flake inputs"
          # checkout fetches only master; use an explicit lease for this branch.
          git push --force-with-lease="refs/heads/$branch:$expected_revision" origin "$branch"

          # Match only open pull requests: `gh pr view <branch>` also resolves a
          # merged or closed pull request for the branch, which silently skips
          # proposing the next update after the previous one merges.
          open_pulls="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [ "$open_pulls" = "0" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: update Nix flake inputs" \
              --body "Automated weekly update of pinned Nix flake inputs. Review the lockfile diff and wait for required validation before deployment."
          fi
