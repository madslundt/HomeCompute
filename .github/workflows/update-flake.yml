name: Propose Nix flake updates

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nix-flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update flake inputs
        run: nix flake update --commit-lock-file
      - name: Create or refresh update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "Nix flake inputs are already current."
            exit 0
          fi

          branch=automation/nix-flake-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add flake.lock
          git commit -m "chore: update Nix flake inputs"
          git push --force-with-lease origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: update Nix flake inputs" \
              --body "Automated weekly update of pinned Nix flake inputs. Review the lockfile diff and wait for required validation before deployment."
          fi
