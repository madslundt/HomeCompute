name: whisper-cpp-gb10-cuda

services:
  whisper-cpp-cuda:
    profiles: [cuda-candidate]
    platform: linux/arm64
    image: homecompute/whisper-cpp-stt:1.9.1-large-v3-f16-cuda121a-hc1
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_BASE_IMAGE: nvcr.io/nvidia/pytorch@sha256:8014e4ffc674ae9cc9aecad04b64b29c3d311ed738e54ac3042d2d45690d19e9
        WHISPER_CPP_COMMIT: f049fff95a089aa9969deb009cdd4892b3e74916
        CUDA_PATCHER_SHA256: ${WHISPER_CPP_CUDA_PATCHER_SHA256:?Set to the reviewed strict-GPU patcher checksum}
        HOME_COMPUTE_REVISION: ${WHISPER_CPP_HOME_COMPUTE_REVISION:?Set to the reviewed HomeCompute source commit}
    container_name: gb10-whisper-cpp-cuda-candidate
    init: true
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 4
    mem_limit: 12g
    pids_limit: 128
    shm_size: 128m
    environment:
      WHISPER_CPP_DEVICE: cuda
      WHISPER_CPP_MODEL_PATH: /models/ggml-large-v3.bin
      WHISPER_CPP_API_KEY_FILE: /run/secrets/whisper_cpp_api_key
      WHISPER_CPP_MAX_AUDIO_SECONDS: ${WHISPER_CPP_MAX_AUDIO_SECONDS:-180}
      WHISPER_CPP_MAX_UPLOAD_BYTES: ${WHISPER_CPP_MAX_UPLOAD_BYTES:-6000000}
      WHISPER_CPP_UPLOAD_TIMEOUT_SECONDS: ${WHISPER_CPP_UPLOAD_TIMEOUT_SECONDS:-120}
      WHISPER_CPP_NATIVE_TIMEOUT_SECONDS: ${WHISPER_CPP_NATIVE_TIMEOUT_SECONDS:-900}
      WHISPER_CPP_NATIVE_THREADS: "4"
      WHISPER_CPP_HOME_COMPUTE_REVISION: ${WHISPER_CPP_HOME_COMPUTE_REVISION:?Set to the reviewed HomeCompute source commit}
      WHISPER_CPP_IMAGE_ID: ${WHISPER_CPP_IMAGE_ID:-}
    volumes:
      - ${WHISPER_CPP_MODEL_FILE:?Set WHISPER_CPP_MODEL_FILE to the verified provisioned model}:/models/ggml-large-v3.bin:ro
      - ${WHISPER_CPP_API_KEY_FILE:?Set WHISPER_CPP_API_KEY_FILE to an externally provisioned candidate key}:/run/secrets/whisper_cpp_api_key:ro
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700"
    logging:
      driver: none
    healthcheck:
      test: [CMD, python3, -I, -B, -c, "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); raise SystemExit(0 if d.get('status')=='ok' and d.get('device')=='cuda' and d.get('compute_backend')=='cuda' and d.get('strict_gpu_patch')=='strict-gpu-buffer-proof-v1' and d.get('strict_gpu_patcher_sha256')=='5c8e2036dce08d2d4ba6c6f065d09f1aa7e0db792b9be9d9120d452ee3f533ca' and type(d.get('gpu_model_buffer_bytes')) is int and d['gpu_model_buffer_bytes']>0 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 2m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [candidate]

networks:
  candidate:
    internal: true
