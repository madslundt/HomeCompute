name: homecompute-t3code

services:
  t3code:
    image: homecompute/t3code:${T3CODE_RELEASE:?select a HomeCompute release}
    build:
      context: .
    platform: linux/amd64
    command: [t3, serve, --host, 0.0.0.0, --port, "3773"]
    working_dir: /data/projects
    user: "12073:12073"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:../paperclip/codex-seccomp.json
    networks:
      default:
        gw_priority: 1
      ingress:
        aliases: [t3code]
    ports:
      - "127.0.0.1:3773:3773"
    volumes:
      - type: bind
        source: /srv/state/t3code
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./codex-local.toml
        target: /data/.codex-homecompute/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./skills/homecompute-team
        target: /data/.codex-homecompute/skills/homecompute-team
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./hermes-code.yaml
        target: /data/.hermes-code/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/homecompute/control-plane/home-core-root.crt
        target: /run/homecompute/home-core-root.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/homecompute/t3code/github-projects/snapshots
        target: /run/homecompute/github-projects
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,size=512m
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3773/"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    cpus: 2
    mem_limit: 3g
    pids_limit: 256
    # The upstream foreground server prints a pairing credential at startup.
    logging:
      driver: none

  github-projects:
    image: python:3.12.15-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    command: [python3, -B, /opt/t3code/github-projects.py, serve]
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./github-projects.py:/opt/t3code/github-projects.py:ro
      - ./github_project_writes.py:/opt/t3code/github_project_writes.py:ro
      - ./projects.json:/opt/t3code/projects.json:ro
      - ../orca/github-projects.py:/opt/t3code/orca-projects.py:ro
      - type: bind
        source: /var/lib/homecompute/t3code/github-projects/credentials
        target: /run/github-projects/credentials
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/homecompute/t3code/github-projects/snapshots
        target: /snapshots
        bind:
          create_host_path: false
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 16
    logging:
      driver: none

networks:
  ingress:
    name: homecompute-t3code-ingress
    external: true
