model_list:
  - model_name: "automation-moe"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: "embedding"
    litellm_params:
      model: "openai/microsoft/harrier-oss-v1-0.6b"
      order: 1
      api_base: "os.environ/EMBEDDING_BASE_URL"
      api_key: "local"
      timeout: 60
    model_info:
      mode: embedding
      max_input_tokens: 2048
      output_vector_size: 1024
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: "stt-danish"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
      input_cost_per_second: 0
  - model_name: "whisper-turbo"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
      input_cost_per_second: 0
  - model_name: "whisper"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
      input_cost_per_second: 0
  - model_name: "omnivoice"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
      output_cost_per_character: 0
  - model_name: "tts-danish"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
      output_cost_per_character: 0
  - model_name: "tts-english"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
      output_cost_per_character: 0
  - model_name: "video"
    litellm_params:
      model: "openai/ltx-2.5"
      order: 1
      api_base: "os.environ/VIDEO_GENERATION_BASE_URL"
      api_key: "local"
      timeout: 120
    model_info:
      mode: video_generation
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_second: 0
      output_cost_per_second: 0
  - model_name: "chatgpt-sol-latest"
    litellm_params:
      model: "chatgpt/gpt-6.1-sol"
    model_info:
      mode: responses
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: "chatgpt-terra-latest"
    litellm_params:
      model: "chatgpt/gpt-6.1-terra"
    model_info:
      mode: responses
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: "chatgpt-luna-latest"
    litellm_params:
      model: "chatgpt/gpt-6-luna"
    model_info:
      mode: responses
      input_cost_per_token: 0
      output_cost_per_token: 0
litellm_settings:
  request_timeout: 600
  num_retries: 0
  drop_params: false
  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  require_key_mcp_access_defined: true
  mcp_disabled_capabilities: [prompts, resources]
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  disable_error_logs: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 5

# Keep the MCP catalog in the reviewed release. Access grants remain in
# LiteLLM's database and are assigned to each virtual key or team in the UI.
mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp?client=claude-code-plugin
    transport: http
    description: Public library documentation lookup from Context7
    allow_all_keys: false
    access_groups: [docs-public]
  n8n:
    url: http://n8n:5678/mcp-server/http
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/N8N_MCP_TOKEN
    description: Owner-only n8n instance MCP; tool names restricted to the reviewed live catalog
    allow_all_keys: false
    access_groups: [n8n-owner]
    allowed_tools:
      - search_workflows
      - execute_workflow
      - get_workflow_execution
      - search_workflow_executions
      - get_workflow_details
      - get_workflow_history
      - get_workflow_version
      - get_workflow_versions_diff
      - publish_workflow
      - unpublish_workflow
      - prepare_workflow_pin_data
      - test_workflow
      - list_credentials
      - list_n8n_gateway_services
      - list_workflow_tags
      - search_data_tables
      - create_data_table
      - rename_data_table
      - add_data_table_column
      - delete_data_table_column
      - rename_data_table_column
      - add_data_table_rows
      - get_data_table_rows
      - search_nodes
      - get_node_types
      - get_workflow_best_practices
      - explore_node_resources
      - validate_workflow
      - validate_node_config
      - create_workflow_from_code
      - search_projects
      - archive_workflow
      - update_workflow
      - restore_workflow_version
      - get_workflow_sdk_reference
      - search_agents
      - get_agent
      - create_agent
      - mutate_agent
      - validate_agent
      - call_agent
      - publish_agent
      - unpublish_agent
      - revert_agent
      - list_agent_versions
      - delete_agent
      - discover_agent_assets
      - verify_agent_mcp_server
      - update_agent_integration
      - get_agent_builder_reference
      - search_n8n_skills
      - get_skill
      - create_skill
      - update_skill
      - delete_skill
  homecompute_hermes:
    url: https://homecompute-capabilities.home.arpa:19445/mcp
    transport: http
    auth_type: oauth_delegate
    description: Hermes-owner capability principal; caller supplies its role-scoped bearer
    allow_all_keys: false
    access_groups: [hermes-owner-tools]
  homecompute_openclaw:
    url: https://homecompute-capabilities.home.arpa:19445/mcp
    transport: http
    auth_type: oauth_delegate
    description: OpenClaw capability principal; caller supplies its role-scoped bearer
    allow_all_keys: false
    access_groups: [openclaw-agent-tools]
  homecompute_openbot_android:
    url: https://homecompute-capabilities.home.arpa:19445/mcp
    transport: http
    auth_type: oauth_delegate
    description: Android bounded UI principal; caller supplies its role-scoped bearer
    allow_all_keys: false
    access_groups: [openbot-android-bounded-ui]
    allowed_tools:
      - homecompute_android_status
      - homecompute_android_screen
      - homecompute_android_apps
      - homecompute_android_visible_text
      - homecompute_android_screenshot
      - homecompute_android_launch_app
      - homecompute_android_tap
      - homecompute_android_swipe
      - homecompute_android_type_text
      - homecompute_android_navigation_key
  aula:
    url: http://aula-mcp:7878/mcp
    transport: http
    description: Read-only Aula calendar and school information
    allow_all_keys: false
    access_groups: [aula-read]
  tilbudstrolden:
    url: http://tilbudstrolden-mcp:8000/mcp
    transport: http
    description: Read-only Danish retail offer search
    allow_all_keys: false
    access_groups: [offers-read]
