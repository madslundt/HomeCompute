model_list:
  - model_name: "automation"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "home"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 20
      stream_timeout: 20
  - model_name: "automation-moe"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "automation-moe-nvidia"
    litellm_params:
      model: "openai/automation-moe-nvidia"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "automation-qualification"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "embedding"
    litellm_params:
      model: "openai/microsoft/harrier-oss-v1-0.6b"
      order: 1
      api_base: "os.environ/EMBEDDING_BASE_URL"
      api_key: "local"
      timeout: 60
    model_info:
      mode: embedding
      max_input_tokens: 2048
      output_vector_size: 1024
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: "stt-danish"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
  - model_name: "whisper-turbo"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
  - model_name: "whisper"
    litellm_params:
      model: "openai/whisper-large-v3"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
  - model_name: "omnivoice"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
  - model_name: "tts-danish"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
  - model_name: "tts-english"
    litellm_params:
      model: "openai/omnivoice"
      order: 1
      api_base: "os.environ/OMNIVOICE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
  - model_name: "video"
    litellm_params:
      model: "openai/ltx-2.5"
      order: 1
      api_base: "os.environ/VIDEO_GENERATION_BASE_URL"
      api_key: "local"
      timeout: 120
    model_info:
      mode: video_generation
      input_cost_per_token: 0
      output_cost_per_token: 0
      input_cost_per_second: 0
      output_cost_per_second: 0
litellm_settings:
  request_timeout: 600
  num_retries: 0
  drop_params: false
  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  require_key_mcp_access_defined: true
  mcp_disabled_capabilities: [prompts, resources]
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  disable_error_logs: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 5

# Keep the MCP catalog in the reviewed release. Access grants remain in
# LiteLLM's database and are assigned to each virtual key or team in the UI.
mcp_servers:
  aula:
    url: http://aula-mcp:7878/mcp
    transport: http
    description: Read-only Aula calendar and school information
    allow_all_keys: false
    access_groups: [aula-read]
  tilbudstrolden:
    url: http://tilbudstrolden-mcp:8000/mcp
    transport: http
    description: Read-only Danish retail offer search
    allow_all_keys: false
    access_groups: [offers-read]
