model_list:
  - model_name: "automation"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "home"
    litellm_params:
      model: "openai/home-fast"
      order: 1
      api_base: "os.environ/COMPUTE_HOME_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 20
      stream_timeout: 20
  - model_name: "automation-moe"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "automation-moe-nvidia"
    litellm_params:
      model: "openai/automation-moe-nvidia"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "assistant-canary"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      stream_timeout: 120
  - model_name: "automation-qualification"
    litellm_params:
      model: "openai/automation-qualification"
      order: 1
      api_base: "os.environ/COMPUTE_AUTOMATION_CANDIDATE_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 600
      stream_timeout: 600
  - model_name: "stt-danish"
    litellm_params:
      model: "openai/stt-danish"
      order: 1
      api_base: "os.environ/COMPUTE_STT_DANISH_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
  - model_name: "whisper-turbo"
    litellm_params:
      model: "openai/whisper-turbo"
      order: 1
      api_base: "os.environ/COMPUTE_STT_MULTILINGUAL_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 120
      response_format: json
    model_info:
      mode: audio_transcription
  - model_name: "plapre"
    litellm_params:
      model: "openai/plapre"
      order: 1
      api_base: "os.environ/PLAPRE_TTS_BASE_URL"
      api_key: os.environ/COMPUTE_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: audio_speech
litellm_settings:
  request_timeout: 600
  num_retries: 0
  drop_params: false
  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  disable_error_logs: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 5
