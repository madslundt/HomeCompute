name: homecompute-control-plane

services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    # The official binary carries this file capability; excluding it from the
    # bounding set makes exec fail even though we listen on port 8443.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      AI_FQDN: ${AI_FQDN:?Set AI_FQDN}
      AI_LEGACY_FQDN: ${AI_LEGACY_FQDN:?Set AI_LEGACY_FQDN}
      N8N_FQDN: ${N8N_FQDN:?Set N8N_FQDN}
      N8N_UPSTREAM: ${N8N_UPSTREAM:?Set N8N_UPSTREAM}
      HERMES_FQDN: ${HERMES_FQDN:?Set HERMES_FQDN}
      HERMES_UPSTREAM: ${HERMES_UPSTREAM:?Set HERMES_UPSTREAM}
      CHAT_FQDN: ${CHAT_FQDN:?Set CHAT_FQDN}
      MODELS_FQDN: ${MODELS_FQDN:?Set MODELS_FQDN}
      CADDY_HTTPS_PORT: "8443"
    ports:
      - ${CONTROL_PLANE_TAILSCALE_BIND_ADDRESS:?Set the exact Tailscale IPv4 address}:${CONTROL_PLANE_TAILSCALE_HTTPS_PORT:-443}:8443/tcp
      - ${CONTROL_PLANE_LAN_BIND_ADDRESS:?Set the exact LAN IPv4 address}:${CONTROL_PLANE_LAN_HTTPS_PORT:-443}:8443/tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONTROL_PLANE_STATE_ROOT:?Set CONTROL_PLANE_STATE_ROOT}/caddy-data:/data
      - ${CONTROL_PLANE_STATE_ROOT:?Set CONTROL_PLANE_STATE_ROOT}/caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      edge:
        ipv4_address: ${CADDY_EDGE_IP:?Set CADDY_EDGE_IP}
        gw_priority: 1
      clients:
        ipv4_address: ${CADDY_CLIENTS_IP:?Set CADDY_CLIENTS_IP}

  litellm:
    image: ${LITELLM_IMAGE:?Set LITELLM_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "101:101"
    group_add:
      - ${CONTROL_PLANE_SECRET_GID:?Set CONTROL_PLANE_SECRET_GID with init}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: [/bin/sh, /opt/homecompute/litellm-entrypoint.sh]
    environment:
      COMPUTE_OPENAI_BASE_URL: ${COMPUTE_OPENAI_BASE_URL:?Set COMPUTE_OPENAI_BASE_URL}
      COMPUTE_AUTOMATION_BASE_URL: ${COMPUTE_AUTOMATION_BASE_URL:?Set COMPUTE_AUTOMATION_BASE_URL}
      COMPUTE_AUTOMATION_CANDIDATE_BASE_URL: ${COMPUTE_AUTOMATION_CANDIDATE_BASE_URL:?Set COMPUTE_AUTOMATION_CANDIDATE_BASE_URL}
      COMPUTE_HOME_BASE_URL: ${COMPUTE_HOME_BASE_URL:?Set COMPUTE_HOME_BASE_URL}
      LITELLM_CONFIG: /etc/litellm/config.yaml
      LITELLM_MIGRATION_DIR: /app/migrations
      PRISMA_BINARY_CACHE_DIR: /app/cache/prisma-python/binaries
      XDG_CACHE_HOME: /app/cache
      LITELLM_NON_ROOT: "true"
      ENFORCE_PRISMA_MIGRATION_CHECK: "true"
      DO_NOT_TRACK: "1"
    expose:
      - "4000"
    secrets:
      - compute_api_key
      - litellm_master_key
      - litellm_salt_key
      - postgres_app_password
    volumes:
      - ${LITELLM_CONFIG_FILE:-./litellm-config.yaml}:/etc/litellm/config.yaml:ro
      - ./litellm-entrypoint.sh:/opt/homecompute/litellm-entrypoint.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=101,gid=101,mode=1770
      - /app/cache:rw,noexec,nosuid,nodev,size=256m,uid=101,gid=101,mode=0770
      - /app/migrations:rw,noexec,nosuid,nodev,size=128m,uid=101,gid=101,mode=0770
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      edge:
        gw_priority: 1
        ipv4_address: ${LITELLM_EDGE_IP:?Set LITELLM_EDGE_IP}
      clients:
        ipv4_address: ${LITELLM_CLIENTS_IP:?Set LITELLM_CLIENTS_IP}
      state: {}
      automation-backup: {}

  automation-backup:
    profiles: [automation-backup]
    image: ${AUTOMATION_BACKUP_IMAGE:?Set AUTOMATION_BACKUP_IMAGE to an immutable amd64 image digest}
    restart: on-failure:3
    init: true
    user: "65532:65532"
    group_add:
      - ${CONTROL_PLANE_SECRET_GID:?Set CONTROL_PLANE_SECRET_GID with init}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      - --alias
      - automation-backup
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - ${AUTOMATION_BACKUP_THREADS:-8}
      - --threads-batch
      - ${AUTOMATION_BACKUP_BATCH_THREADS:-10}
      - --ctx-size
      - ${AUTOMATION_BACKUP_CONTEXT_SIZE:-32768}
      - --parallel
      - "1"
      - --batch-size
      - "512"
      - --ubatch-size
      - "256"
      - --jinja
      - --reasoning
      - "off"
      - --api-key-file
      - /run/secrets/compute_api_key
      - --no-webui
      - --no-slots
      - --metrics
      - --log-disable
    expose:
      - "8080"
    secrets:
      - compute_api_key
    volumes:
      - ${AUTOMATION_BACKUP_STATE_ROOT:?Set AUTOMATION_BACKUP_STATE_ROOT}/models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          key="$$(cat /run/secrets/compute_api_key)" &&
          curl --fail --silent --show-error --max-time 5
          --header "Authorization: Bearer $$key"
          http://127.0.0.1:8080/health >/dev/null
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 15m
    cpus: ${AUTOMATION_BACKUP_CPUS:-8.0}
    mem_limit: ${AUTOMATION_BACKUP_MEMORY_LIMIT:-28g}
    memswap_limit: ${AUTOMATION_BACKUP_MEMORY_LIMIT:-28g}
    pids_limit: 384
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    networks:
      automation-backup: {}

  plapre-wyoming-proxy:
    profiles: [speech-proxies]
    image: ${SPEECH_PROXY_IMAGE:?Set SPEECH_PROXY_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EDGE_LISTEN_PORT: "10201"
      EDGE_UPSTREAM_HOST: ${PLAPRE_WYOMING_UPSTREAM_HOST:-10.77.10.10}
      EDGE_UPSTREAM_PORT: ${PLAPRE_WYOMING_UPSTREAM_PORT:-10201}
    entrypoint: [python3, /opt/homecompute/tcp-edge-proxy.py]
    ports:
      - ${CONTROL_PLANE_LAN_BIND_ADDRESS:?Set the exact LAN IPv4 address}:${PLAPRE_WYOMING_LAN_PORT:-10201}:10201/tcp
    volumes:
      - ../../scripts/tcp-edge-proxy.py:/opt/homecompute/tcp-edge-proxy.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    healthcheck:
      test: [CMD, python3, /opt/homecompute/tcp-edge-proxy.py, --probe-upstream]
      interval: 15s
      timeout: 7s
      retries: 4
      start_period: 15s
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
    networks:
      edge:
        ipv4_address: ${PLAPRE_PROXY_EDGE_IP:?Set PLAPRE_PROXY_EDGE_IP}

  hviske-wyoming-proxy:
    profiles: [speech-proxies]
    image: ${SPEECH_PROXY_IMAGE:?Set SPEECH_PROXY_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EDGE_LISTEN_PORT: "10301"
      EDGE_UPSTREAM_HOST: ${HVISKE_WYOMING_UPSTREAM_HOST:-10.77.10.10}
      EDGE_UPSTREAM_PORT: ${HVISKE_WYOMING_UPSTREAM_PORT:-10301}
    entrypoint: [python3, /opt/homecompute/tcp-edge-proxy.py]
    ports:
      - ${CONTROL_PLANE_LAN_BIND_ADDRESS:?Set the exact LAN IPv4 address}:${HVISKE_WYOMING_LAN_PORT:-10301}:10301/tcp
    volumes:
      - ../../scripts/tcp-edge-proxy.py:/opt/homecompute/tcp-edge-proxy.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    healthcheck:
      test: [CMD, python3, /opt/homecompute/tcp-edge-proxy.py, --probe-upstream]
      interval: 15s
      timeout: 7s
      retries: 4
      start_period: 15s
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
    networks:
      edge:
        ipv4_address: ${HVISKE_PROXY_EDGE_IP:?Set HVISKE_PROXY_EDGE_IP}

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    # Alpine postgres is UID/GID 70. Starting without a root-to-postgres switch
    # preserves the supplementary group that can read sops secret mounts.
    user: "70:70"
    group_add:
      - ${CONTROL_PLANE_SECRET_GID:?Set CONTROL_PLANE_SECRET_GID with init}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: [postgres, -c, max_connections=50]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TZ: ${TIMEZONE:-Etc/UTC}
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - ${CONTROL_PLANE_STATE_ROOT:?Set CONTROL_PLANE_STATE_ROOT}/postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-litellm-role.sh:ro
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      state: {}

networks:
  edge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
      com.docker.network.bridge.name: br-hc-ctrl
    ipam:
      config:
        - subnet: ${CONTROL_PLANE_EDGE_SUBNET:?Set CONTROL_PLANE_EDGE_SUBNET}
          gateway: ${CONTROL_PLANE_EDGE_GATEWAY:?Set CONTROL_PLANE_EDGE_GATEWAY}
  state:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  automation-backup:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  clients:
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${CONTROL_PLANE_CLIENTS_SUBNET:?Set CONTROL_PLANE_CLIENTS_SUBNET}

secrets:
  compute_api_key:
    file: ${COMPUTE_API_KEY_FILE:?Set COMPUTE_API_KEY_FILE}
  litellm_master_key:
    file: ${LITELLM_MASTER_KEY_FILE:?Set LITELLM_MASTER_KEY_FILE}
  litellm_salt_key:
    file: ${LITELLM_SALT_KEY_FILE:?Set LITELLM_SALT_KEY_FILE}
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set POSTGRES_ADMIN_PASSWORD_FILE}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:?Set POSTGRES_APP_PASSWORD_FILE}
