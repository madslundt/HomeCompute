preset:
  name: homecompute-hermes-mattermost
  description: Native Mattermost bot REST and WebSocket access to the private home-core server
network_policies:
  mattermost:
    name: mattermost
    endpoints:
      - host: home-core.tail479ad.ts.net
        port: 9443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: hermes-owner-mattermost
        rules:
          - allow: {method: GET, path: "/llm/status"}
          - allow: {method: GET, path: "/api/v4/**"}
          - allow: {method: POST, path: "/api/v4/posts"}
          - allow: {method: POST, path: "/api/v4/files"}
          - allow: {method: PUT, path: "/api/v4/posts/*"}
          - allow: {method: PATCH, path: "/api/v4/posts/*/patch"}
          - allow: {method: DELETE, path: "/api/v4/posts/*"}
          - allow: {method: POST, path: "/api/v4/users/xinjus1gbbdrtknp1oemxpd6qo/typing"}
      - host: home-core.tail479ad.ts.net
        port: 9443
        path: /api/v4/websocket
        protocol: websocket
        websocket_credential_rewrite: true
        enforcement: enforce
        credential_binding:
          provider: hermes-owner-mattermost
        rules:
          - allow: {method: GET, path: /api/v4/websocket}
          - allow: {method: WEBSOCKET_TEXT, path: /api/v4/websocket}
    binaries:
      - {path: /opt/hermes/.venv/bin/python}
      - {path: /opt/hermes/.venv/bin/python3}
      - {path: /usr/bin/python3}
      - {path: /usr/bin/python3.13}
