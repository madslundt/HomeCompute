preset:
  name: homecompute-hermes-upgrade-mattermost-probe
  description: Authentication-only Mattermost access for the synthetic upgrade sandbox
network_policies:
  mattermost_probe:
    name: mattermost_probe
    endpoints:
      - host: home-core.tail479ad.ts.net
        port: 9443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: hermes-personal-mattermost
        rules:
          - allow: {method: GET, path: /api/v4/users/me}
      - host: home-core.tail479ad.ts.net
        port: 9443
        path: /api/v4/websocket
        protocol: websocket
        websocket_credential_rewrite: true
        enforcement: enforce
        credential_binding:
          provider: hermes-personal-mattermost
        rules:
          - allow: {method: GET, path: /api/v4/websocket}
          - allow: {method: WEBSOCKET_TEXT, path: /api/v4/websocket}
    binaries:
      - {path: /opt/hermes/.venv/bin/python}
      - {path: /opt/hermes/.venv/bin/python3}
