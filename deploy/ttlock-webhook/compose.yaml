name: homecompute-ttlock-webhook

services:
  gateway:
    build:
      context: .
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TTLOCK_WEBHOOK_SECRET: ${TTLOCK_WEBHOOK_SECRET:?Set a unique high-entropy path secret}
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:?Set the private Home Assistant webhook URL}
      HA_TTLOCK_WEBHOOK_URL: ${HA_TTLOCK_WEBHOOK_URL:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16384}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      DEDUPE_TTL_SECONDS: ${DEDUPE_TTL_SECONDS:-600}
      HA_TIMEOUT_SECONDS: ${HA_TIMEOUT_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700
    ports:
      - "127.0.0.1:${TTLOCK_GATEWAY_PORT:-8085}:8080"
    extra_hosts:
      - "homeassistant.local:${HOME_ASSISTANT_ADDRESS:?Set the resolved Home Assistant LAN address}"
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, /app/healthcheck.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks: [gateway]

networks:
  gateway:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
