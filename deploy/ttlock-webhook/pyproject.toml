[project]
name = "homecompute-ttlock-webhook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "httpx==0.28.1",
  "pydantic-settings==2.16.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
