name: ai-compute

services:
  model-fetch:
    profiles:
      - prepare
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to an immutable image digest}
    user: "${GB10_RUNTIME_UID:?Run setup-compute-node.sh init}:${GB10_RUNTIME_GID:?Run setup-compute-node.sh init}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /var/cache/vllm
      HF_HOME: /var/cache/huggingface
      MODEL_ID: ${MODEL_ID:?Set MODEL_ID}
      MODEL_REVISION: ${MODEL_REVISION:?Set MODEL_REVISION}
      TOKENIZER_REVISION: ${TOKENIZER_REVISION:?Set TOKENIZER_REVISION}
      CODE_REVISION: ${CODE_REVISION:?Set CODE_REVISION}
      CHAT_TEMPLATE_SHA256: ${CHAT_TEMPLATE_SHA256:?Set CHAT_TEMPLATE_SHA256}
      HF_HUB_DISABLE_TELEMETRY: "1"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        export HF_TOKEN="$$(cat /run/secrets/hf_token)"
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        from huggingface_hub import snapshot_download

        revisions = dict.fromkeys((
            os.environ["MODEL_REVISION"],
            os.environ["TOKENIZER_REVISION"],
            os.environ["CODE_REVISION"],
        ))
        paths = {}
        for revision in revisions:
            paths[revision] = snapshot_download(
                repo_id=os.environ["MODEL_ID"],
                revision=revision,
                token=os.environ["HF_TOKEN"],
            )
        tokenizer_config = Path(paths[os.environ["TOKENIZER_REVISION"]]) / "tokenizer_config.json"
        document = json.loads(tokenizer_config.read_text(encoding="utf-8"))
        template = document.get("chat_template")
        if template is None:
            raise RuntimeError("tokenizer_config.json has no chat_template")
        canonical = template if isinstance(template, str) else json.dumps(
            template, ensure_ascii=False, sort_keys=True, separators=(",", ":")
        )
        actual = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
        expected = os.environ["CHAT_TEMPLATE_SHA256"].lower()
        if actual != expected:
            raise RuntimeError(f"chat template SHA-256 mismatch: expected {expected}, found {actual}")
        PY
    secrets:
      - hf_token
    volumes:
      - type: bind
        source: ${GB10_ROOT:?Set GB10_ROOT}/cache/huggingface
        target: /var/cache/huggingface
      - type: bind
        source: ${GB10_ROOT:?Set GB10_ROOT}/cache/vllm
        target: /var/cache/vllm
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    networks:
      - artifact-fetch

  text-primary:
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to an immutable image digest}
    container_name: gb10-text-primary
    restart: on-failure:5
    init: true
    user: "${GB10_RUNTIME_UID:?Run setup-compute-node.sh init}:${GB10_RUNTIME_GID:?Run setup-compute-node.sh init}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: "${VLLM_SHM_SIZE:-16gb}"
    ports:
      - "${GB10_BIND_ADDRESS:-127.0.0.1}:${VLLM_HOST_PORT:-8000}:8000"
    environment:
      HOME: /var/cache/vllm
      HF_HOME: /var/cache/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      VLLM_CACHE_ROOT: /var/cache/vllm
      VLLM_LOGGING_LEVEL: INFO
      VLLM_SPECULATIVE_CONFIG: "${VLLM_SPECULATIVE_CONFIG:-}"
      TOKENIZERS_PARALLELISM: "false"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        export VLLM_API_KEY="$$(cat /run/secrets/vllm_api_key)"
        set --
        if [ -n "$${VLLM_SPECULATIVE_CONFIG}" ]; then
          set -- --speculative-config "$${VLLM_SPECULATIVE_CONFIG}"
        fi
        exec vllm serve "${MODEL_ID}" \
          --revision "${MODEL_REVISION}" \
          --tokenizer-revision "${TOKENIZER_REVISION}" \
          --code-revision "${CODE_REVISION}" \
          --served-model-name coding automation research home meeting assistant \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --kv-cache-dtype fp8 \
          --attention-backend "${VLLM_ATTENTION_BACKEND:-flashinfer}" \
          --moe-backend "${VLLM_MOE_BACKEND:-marlin}" \
          --gpu-memory-utilization "${VLLM_GPU_MEMORY_UTILIZATION:-0.40}" \
          --generation-config vllm \
          --max-model-len "${VLLM_MAX_MODEL_LEN:-32768}" \
          --max-num-seqs "${VLLM_MAX_NUM_SEQS:-2}" \
          --max-num-batched-tokens "${VLLM_MAX_BATCHED_TOKENS:-8192}" \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prefix-caching \
          "$$@" \
          --load-format fastsafetensors \
          --reasoning-parser "${VLLM_REASONING_PARSER:-qwen3}" \
          --tool-call-parser "${VLLM_TOOL_CALL_PARSER:-qwen3_xml}" \
          --enable-auto-tool-choice \
          --disable-uvicorn-access-log
    secrets:
      - vllm_api_key
    volumes:
      - type: bind
        source: ${GB10_ROOT:?Set GB10_ROOT}/cache/huggingface
        target: /var/cache/huggingface
        read_only: true
      - type: bind
        source: ${GB10_ROOT:?Set GB10_ROOT}/cache/vllm
        target: /var/cache/vllm
      - type: bind
        source: ${GB10_ROOT:?Set GB10_ROOT}/models
        target: /models
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8g
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    networks:
      - inference

networks:
  inference:
    name: gb10-inference
    driver: bridge
    attachable: false
    internal: true
  artifact-fetch:
    name: gb10-artifact-fetch
    driver: bridge
    attachable: false

secrets:
  hf_token:
    file: ${HF_TOKEN_FILE:?Set HF_TOKEN_FILE}
  vllm_api_key:
    file: ${VLLM_API_KEY_FILE:?Set VLLM_API_KEY_FILE}
