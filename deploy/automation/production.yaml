# Apply together with compose.yaml only after restoring and unpublishing workflows.
services:
  n8n:
    environment:
      N8N_HOST: n8n.home.arpa
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.home.arpa
      N8N_MCP_BASE_URL: https://n8n.home.arpa
      WEBHOOK_URL: https://n8n.home.arpa/
      N8N_PROXY_HOPS: "1"
      # Durable local-LLM waits are excluded from workflow wall-clock budgets.
      # Individual HTTP, MCP and model calls retain bounded timeouts.
      EXECUTIONS_TIMEOUT: "-1"
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/homecompute-caddy-root.crt
    volumes:
      - ${HOMECOMPUTE_CA_CERT_FILE:-/srv/state/automation/certs/homecompute-caddy-root.crt}:/etc/ssl/certs/homecompute-caddy-root.crt:ro
    extra_hosts:
      - homeassistant.local:192.168.30.30
    networks:
      mcp-clients:
        ipv4_address: ${N8N_MCP_CLIENTS_IP:?Set N8N_MCP_CLIENTS_IP}
    ports:
      - "127.0.0.1:15678:5678"
      - "192.168.30.122:15678:5678"
      - "100.110.248.102:15678:5678"

  aula-mcp:
    image: homecompute/aula-mcp:d9a27d84933446783c89446ba3e9d799fd47ea2c-n8n1-context-a488bbc
    pull_policy: never
    build:
      context: .
      dockerfile: aula.Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Europe/Copenhagen
      AULA_MCP_DIR: /data
      # Non-loopback inside the container only; the host publication is local.
      AULA_MCP_HOST: 0.0.0.0
      AULA_MCP_ALLOW_REMOTE: "1"
      AULA_MCP_PORT: "7878"
      AULA_MCP_WRITE: "0"
      AULA_MCP_RAW: "0"
      AULA_MCP_LOG: "0"
      # n8n may leave a session behind after testing or interrupted executions.
      AULA_MCP_HTTP_MAX_SESSIONS: "32"
      AULA_MCP_HTTP_IDLE_MS: "60000"
    volumes:
      - ${AULA_MCP_STATE_ROOT:?Set AULA_MCP_STATE_ROOT}:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1770
    ports:
      - "127.0.0.1:17878:7878"
    networks:
      migration:
        ipv4_address: 172.28.201.3
      mcp-backends:
        ipv4_address: ${AULA_MCP_BACKENDS_IP:?Set AULA_MCP_BACKENDS_IP}
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:7878/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  tilbudstrolden-mcp:
    image: homecompute/tilbudstrolden-mcp:fcc9c179b755e751d09f476a8427fa3da80bc64b
    pull_policy: never
    build:
      context: .
      dockerfile: tilbudstrolden.Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Europe/Copenhagen
      TILBUDSTROLDEN_DATA: /data/tilbudstrolden.json
    volumes:
      - ${TILBUDSTROLDEN_STATE_ROOT:?Set TILBUDSTROLDEN_STATE_ROOT}:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    ports:
      - "127.0.0.1:17879:8000"
    networks:
      migration:
        ipv4_address: 172.28.201.4
      mcp-backends:
        ipv4_address: ${TILBUDSTROLDEN_MCP_BACKENDS_IP:?Set TILBUDSTROLDEN_MCP_BACKENDS_IP}
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  banknorwegian-mcp:
    image: homecompute/banknorwegian-mcp:1.0.0
    pull_policy: never
    build:
      context: .
      dockerfile: banknorwegian.Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Europe/Copenhagen
      BN_STATE_FILE: /data/state.json
      BN_SANDBOX: "${BN_SANDBOX:-true}"
      BN_CLIENT_ID: "${BN_CLIENT_ID:?Set BN_CLIENT_ID on the host}"
      BN_CLIENT_SECRET: "${BN_CLIENT_SECRET:?Set BN_CLIENT_SECRET on the host; never in Git}"
      BN_REDIRECT_URI: "${BN_REDIRECT_URI:-http://home-core:17880/callback}"
      BN_REGION: "${BN_REGION:-NO}"
      BN_PSU_ID: "${BN_PSU_ID:-homecompute-owner}"
      # Bank Norwegian serves the Buypass PSD2 root CAs that distros do not ship.
      BN_CA_FILE: "${BN_CA_FILE:-/data/psd2-roots.pem}"
      BANKNORWEGIAN_MCP_HOST: 0.0.0.0
      BANKNORWEGIAN_MCP_PORT: "8090"
    volumes:
      - "${BANKNORWEGIAN_MCP_STATE_ROOT:?Set BANKNORWEGIAN_MCP_STATE_ROOT}:/data"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    ports:
      - "127.0.0.1:17880:8090"
      - "192.168.30.122:17880:8090"
    networks:
      migration:
        ipv4_address: 172.28.201.5
      mcp-backends:
        ipv4_address: "${BANKNORWEGIAN_MCP_BACKENDS_IP:?Set BANKNORWEGIAN_MCP_BACKENDS_IP}"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  migration:
    internal: false
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-hc-n8n
    ipam:
      config:
        - subnet: 172.28.201.0/24
  mcp-clients:
    external: true
    name: homecompute-control-plane_mcp-clients
  mcp-backends:
    external: true
    name: homecompute-control-plane_mcp-backends
