name: homecompute-orca

services:
  orca:
    image: homecompute/orca:${ORCA_RELEASE:?select a HomeCompute release}
    build: .
    platform: linux/amd64
    user: "12074:12074"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp:../paperclip/codex-seccomp.json"]
    environment:
      HTTPS_PROXY: http://orca-egress:3128
      https_proxy: http://orca-egress:3128
      HTTP_PROXY: http://orca-egress:3128
      http_proxy: http://orca-egress:3128
      NO_PROXY: localhost,127.0.0.1,::1,orca-gateway
      no_proxy: localhost,127.0.0.1,::1,orca-gateway
    volumes:
      - type: bind
        source: /srv/state/orca
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/homecompute/orca/github-projects/snapshots
        target: /etc/homecompute-orca/github-projects
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    networks:
      runtime:
        ipv4_address: 172.28.218.2
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "4", "http://127.0.0.1:6768/web-index.html"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    cpus: 3.0
    mem_limit: 3g
    pids_limit: 384
    # Orca/provider diagnostics can contain session data. Pairing is requested
    # separately on an operator terminal and never emitted during startup.
    logging:
      driver: none

  orca-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, /etc/homecompute-orca/gateway-entrypoint.sh]
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway-entrypoint.sh:/etc/homecompute-orca/gateway-entrypoint.sh:ro
      - type: bind
        source: /var/lib/homecompute/orca/inference-key
        target: /run/orca/inference-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/homecompute/control-plane/home-core-root.crt
        target: /run/orca/home-core-root.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      runtime:
        ipv4_address: 172.28.218.3
      ingress:
        ipv4_address: 172.28.219.3
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://172.28.218.3:18080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: none

  orca-egress:
    image: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /opt/homecompute
    command: [python3, -B, egress.py]
    volumes:
      - ../../scripts/openclaw_site_egress.py:/opt/homecompute/openclaw_site_egress.py:ro
      - ./egress.py:/opt/homecompute/egress.py:ro
      - ./egress-hosts.json:/etc/homecompute-orca/egress-hosts.json:ro
    networks:
      runtime:
        ipv4_address: 172.28.218.4
      uplink:
        gw_priority: 1
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('172.28.218.4', 3128), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: none

  orca-projects:
    image: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python3, -B, /opt/orca/github-projects.py, serve]
    depends_on:
      orca-egress:
        condition: service_healthy
    environment:
      HTTPS_PROXY: http://orca-egress:3128
      https_proxy: http://orca-egress:3128
    volumes:
      - ./github-projects.py:/opt/orca/github-projects.py:ro
      - ./teams.json:/opt/orca/teams.json:ro
      - type: bind
        source: /var/lib/homecompute/orca/github-projects/credentials
        target: /run/orca-projects/credentials
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/homecompute/orca/github-projects/snapshots
        target: /snapshots
        bind:
          create_host_path: false
    networks:
      runtime:
        ipv4_address: 172.28.218.5
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 16
    logging:
      driver: none

networks:
  runtime:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{subnet: 172.28.218.0/29}]
  ingress:
    name: homecompute-orca-ingress
    external: true
  uplink:
    enable_ipv6: false
