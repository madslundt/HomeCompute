name: homecompute-homepage

services:
  homepage:
    image: ${HOMEPAGE_IMAGE:?Set HOMEPAGE_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Set the exact allowed host headers}
    volumes:
      - ./config:/app/config:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0750
      - /app/config/logs:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0750
    ports:
      - "127.0.0.1:${HOMEPAGE_PORT:-80}:3000"
      - "${HOMEPAGE_LAN_ADDRESS:?Set the home-core LAN address}:${HOMEPAGE_PORT:-80}:3000"
      - "${HOMEPAGE_TAILSCALE_ADDRESS:?Set the home-core Tailscale address}:${HOMEPAGE_PORT:-80}:3000"
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks: [homepage]

networks:
  homepage:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
