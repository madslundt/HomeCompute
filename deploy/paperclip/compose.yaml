name: homecompute-paperclip

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:2026.1117.0@sha256:bdf38d10544dc6c831e16dc027f23ad586353ef3be1a1b2c6979e63b956aceb1
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 90s
    # Embedded PostgreSQL creates native library symlinks below /app at first boot.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: https://paperclip.home.arpa
      PAPERCLIP_TELEMETRY_DISABLED: "true"
    env_file:
      - ${PAPERCLIP_SECRETS_FILE:-/run/secrets/paperclip/environment}
    volumes:
      - type: bind
        source: /srv/state/paperclip
        target: /paperclip
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test: [CMD, curl, -fsS, -H, "Host: paperclip.home.arpa", "http://127.0.0.1:3100/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      paperclip: {}

  paperclip-inference:
    profiles: [inference]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    # The upstream Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -eu, /opt/homecompute/inference-entrypoint.sh]
    volumes:
      - ./inference.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./inference-entrypoint.sh:/opt/homecompute/inference-entrypoint.sh:ro
      - type: bind
        source: /var/lib/homecompute/paperclip/inference-key
        target: /run/paperclip/inference-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/homecompute/control-plane/home-core-root.crt
        target: /run/paperclip/home-core-root.crt
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:18080/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 4
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
    network_mode: service:paperclip
    depends_on:
      paperclip:
        condition: service_healthy
        restart: true

networks:
  paperclip:
    name: homecompute-paperclip
    external: true
