name: homecompute-mattermost

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a digest-pinned PostgreSQL image}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_DB: mattermost
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      TZ: Europe/Copenhagen
    secrets: [database_password]
    volumes:
      - ${MATTERMOST_STATE_ROOT:?Set MATTERMOST_STATE_ROOT}/postgres:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    healthcheck:
      test: [CMD, pg_isready, -U, mattermost, -d, mattermost]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    logging: &logging
      driver: local
      options: {max-size: 10m, max-file: "3"}
    networks: [database]

  mattermost:
    image: ${MATTERMOST_IMAGE:?Set a digest-pinned Team Edition image}
    restart: unless-stopped
    init: true
    user: "2000:2000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Upstream rewrites static root.html at startup; retain its supported
    # writable image layout while keeping every persistent path explicit.
    environment:
      TZ: Europe/Copenhagen
      MM_INSTALL_TYPE: docker
    volumes:
      - ${MATTERMOST_STATE_ROOT}/config:/mattermost/config
      - ${MATTERMOST_STATE_ROOT}/data:/mattermost/data
      - ${MATTERMOST_STATE_ROOT}/logs:/mattermost/logs
      - ${MATTERMOST_STATE_ROOT}/plugins:/mattermost/plugins
      - ${MATTERMOST_STATE_ROOT}/client-plugins:/mattermost/client/plugins
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,uid=2000,gid=2000,mode=1770
      - /var/tmp:rw,nosuid,nodev,noexec,size=16m,uid=2000,gid=2000,mode=0700
    ports: ["127.0.0.1:18065:8065"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /mattermost/bin/mmctl, system, status, --local]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s
    cpus: 2
    mem_limit: 2g
    # Go can create many OS threads. Bound memory without a low process cap.
    logging: *logging
    networks: [application, database]

  proxy:
    image: ${CADDY_IMAGE:?Set a digest-pinned Caddy image}
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # The official caddy binary carries this file capability even on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      MATTERMOST_TAILSCALE_ADDRESS: ${MATTERMOST_TAILSCALE_ADDRESS}
      MATTERMOST_FQDN: ${MATTERMOST_FQDN}
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MATTERMOST_CERTIFICATE_ROOT:?Set the certificate directory}:/certificates:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    depends_on:
      mattermost: {condition: service_healthy}
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    logging: *logging

networks:
  application: {}
  database: {internal: true}

secrets:
  database_password:
    file: ${MATTERMOST_STATE_ROOT}/secrets/database-password
