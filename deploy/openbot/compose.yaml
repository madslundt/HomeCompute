services:
  openbot:
    container_name: homecompute-openbot
    image: ghcr.io/nightly-labs/openbot@sha256:20ecb481d3d782b754b8bba6dc4dbaf1f84c4e72b569611330e22c3ef2bd1f9b
    platform: linux/amd64
    environment:
      NODE_EXTRA_CA_CERTS: /run/homecompute/home-core-root.crt
      CODEX_CA_CERTIFICATE: /run/homecompute/home-core-root.crt
      SSL_CERT_FILE: /run/homecompute/agent-ca-bundle.pem
    extra_hosts:
      - homecompute-capabilities.home.arpa:10.77.20.1
      - llm.home.arpa:10.77.20.1
    # systemd starts the container only after the per-container egress guard.
    restart: "no"
    security_opt:
      - seccomp=/home/hermes-operator/.local/share/homecompute-openbot/current/seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 2048
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /home/hermes-operator/.local/share/homecompute-openbot/data:/data
      - /etc/homecompute-openbot/home-core-root.crt:/run/homecompute/home-core-root.crt:ro
      - /etc/homecompute-openbot/agent-ca-bundle.pem:/run/homecompute/agent-ca-bundle.pem:ro
    networks:
      openbot:
        ipv4_address: 172.30.192.2
  openbot_operator:
    container_name: homecompute-openbot-operator
    image: ghcr.io/nightly-labs/openbot@sha256:20ecb481d3d782b754b8bba6dc4dbaf1f84c4e72b569611330e22c3ef2bd1f9b
    platform: linux/amd64
    environment:
      NODE_EXTRA_CA_CERTS: /run/homecompute/home-core-root.crt
      CODEX_CA_CERTIFICATE: /run/homecompute/home-core-root.crt
      SSL_CERT_FILE: /run/homecompute/agent-ca-bundle.pem
    extra_hosts:
      - mcp.home.arpa:10.77.20.1
    restart: "no"
    security_opt:
      - seccomp=/home/hermes-operator/.local/share/homecompute-openbot/current/seccomp.json
      - no-new-privileges:true
    shm_size: 512m
    stop_grace_period: 60s
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /home/hermes-operator/.local/share/homecompute-openbot/operator-data:/data
      - /etc/homecompute-openbot/home-core-root.crt:/run/homecompute/home-core-root.crt:ro
      - /etc/homecompute-openbot/agent-ca-bundle.pem:/run/homecompute/agent-ca-bundle.pem:ro
    networks:
      openbot_operator:
        ipv4_address: 172.30.194.2

networks:
  openbot:
    name: homecompute-openbot
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.192.0/24
          gateway: 172.30.192.1
  openbot_operator:
    name: homecompute-openbot-operator
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.194.0/24
          gateway: 172.30.194.1
