services:
  openbot:
    container_name: homecompute-openbot
    image: ghcr.io/nightly-labs/openbot@sha256:049c2c16130f9577c5f84ee942045ee211c78f337414cda0d2aaf4e801fb4913
    platform: linux/amd64
    environment:
      NODE_EXTRA_CA_CERTS: /run/homecompute/home-core-root.crt
    extra_hosts:
      - homecompute-capabilities.home.arpa:10.77.20.1
      - mcp.home.arpa:10.77.20.1
    # systemd starts the container only after the per-container egress guard.
    restart: "no"
    security_opt:
      - seccomp=/home/hermes-operator/.local/share/homecompute-openbot/current/seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 2048
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /home/hermes-operator/.local/share/homecompute-openbot/data:/data
      - /etc/homecompute-openbot/home-core-root.crt:/run/homecompute/home-core-root.crt:ro
    networks:
      openbot:
        ipv4_address: 172.30.192.2

networks:
  openbot:
    name: homecompute-openbot
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.192.0/24
          gateway: 172.30.192.1
